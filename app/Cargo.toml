[package]
name = "talk-desktop"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Talk local test app. Fictional data only."

[workspace]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]

[lib]
name = "talk_desktop"
path = "src/workspace.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Talk"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "talk-preview"
path = "src/bin/preview.rs"

[dependencies]
talk-prototype = { path = ".." }
serde_json = "1"
zeroize = "1"
tauri = { version = "2", optional = true, features = ["custom-protocol"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSObject", "NSString"] }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSSharingService"] }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
