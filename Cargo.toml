[package]
name = "talk-prototype"
version = "0.2.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Local, private prototype of Talk. Not for real messages."

[dependencies]
# Exact versions: the post-quantum suites are provisional and may change.
openmls = { version = "=0.9.2", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { version = "=0.4.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = "=0.6.0"
rustls = "0.23"
rcgen = "0.14"
argon2 = "0.5"
zeroize = "1"
